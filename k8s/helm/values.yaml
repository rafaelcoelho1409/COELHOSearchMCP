environment: production

# Loaded from Kubernetes Secret by the upload_env_to_k3d.py Script
# (default secret name: coelho-search-mcp-secret, namespace: coelho-search-mcp).
secretName: coelho-search-mcp-secret

# Maps each provider's API key secret key -> the env var the FastMCP process
# reads. Provider adapters read these env vars via their frozen-dataclass
# config (e.g. TavilyConfig reads TAVILY_API_KEY). `optional: true` means the
# chart still deploys cleanly when a given key isn't populated yet — the
# provider then runs keyless or is unavailable until the key is added.
secretMappings:
  - envName: TAVILY_API_KEY
    key: tavily-api-key
  - envName: EXA_API_KEY
    key: exa-api-key
  - envName: JINA_API_KEY
    key: jina-api-key
  - envName: LINKUP_API_KEY
    key: linkup-api-key


fastmcp:
  image: localhost:5001/coelho-search-mcp-fastmcp:latest
  imagePullPolicy: Always
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  portsSettings:
    ports:
      # Service port intentionally != targetPort (8001 vs 8000): fastapi's
      # Service also declares port 8000, and k3d's svclb LoadBalancer
      # mechanism binds a hostPort matching this field on every node — two
      # LoadBalancer Services sharing the same `port` collide there (fastapi
      # already holds hostPort 8000 on all 3 nodes, so fastmcp's svclb pods
      # could never schedule). The container itself is untouched — it still
      # listens on 8000 (targetPort + the probes below).
      - name: http
        port: 8001
        targetPort: 8000
        nodePort: 30024
        protocol: TCP
    type: LoadBalancer
  startupProbeSettings:
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 12
      periodSeconds: 5
  livenessProbeSettings:
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
  readinessProbeSettings:
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 3