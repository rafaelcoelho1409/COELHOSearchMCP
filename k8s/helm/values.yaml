environment: production


fastmcp:
  image: localhost:5001/coelho-search-mcp-fastmcp:latest
  imagePullPolicy: Always
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  portsSettings:
    ports:
      # Service port intentionally != targetPort (8001 vs 8000): fastapi's
      # Service also declares port 8000, and k3d's svclb LoadBalancer
      # mechanism binds a hostPort matching this field on every node — two
      # LoadBalancer Services sharing the same `port` collide there (fastapi
      # already holds hostPort 8000 on all 3 nodes, so fastmcp's svclb pods
      # could never schedule). The container itself is untouched — it still
      # listens on 8000 (targetPort + the probes below).
      - name: http
        port: 8001
        targetPort: 8000
        nodePort: 30024
        protocol: TCP
    type: LoadBalancer
  startupProbeSettings:
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 12
      periodSeconds: 5
  livenessProbeSettings:
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
  readinessProbeSettings:
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 3