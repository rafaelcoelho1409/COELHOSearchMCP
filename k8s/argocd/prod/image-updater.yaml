# =============================================================================
# ARGOCD IMAGE UPDATER CR - COELHO Search MCP (PROD — COELHO Search MCP standalone k3d)
# =============================================================================
# SCOPE: pairs with application.yaml. Images are built and pushed to
#   coelho-search-mcp-registry:5000 via `skaffold build --push
#   --default-repo=coelho-search-mcp-registry:5000`. Image Updater polls that
#   registry every 2 minutes (digest strategy) and patches the Application
#   when a new digest is detected, triggering a rollout.
#
# Apply:
#   kubectl apply -f k8s/argocd/prod/
#
# Flow: skaffold build → coelho-search-mcp-registry:5000 → Image Updater
#   detects new digest → patches Application → ArgoCD reconciles → rollout.
# =============================================================================
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: coelho-search-mcp
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: coelho-search-mcp
      images:
        - alias: fastmcp
          imageName: coelho-search-mcp-registry:5000/coelho-search-mcp-fastmcp:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              spec: fastmcp.image
  writeBackConfig:
    method: argocd
